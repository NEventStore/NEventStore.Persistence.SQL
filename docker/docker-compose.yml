services:
  sqlexpress:
    image: mcr.microsoft.com/mssql/server:2022-RTM-GDR1-ubuntu-20.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      SA_PASSWORD: Password1
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Password1 -Q 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - sqldata:/var/opt/mssql

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: NEventStore
      MYSQL_ROOT_PASSWORD: Password1
      MYSQL_USER: sa
      MYSQL_PASSWORD: Password1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pPassword1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - mysqldata:/var/lib/mysql

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: NEventStore
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: Password1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d NEventStore"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - postgresdata:/var/lib/postgresql/data

  oracle:
    image: gvenzl/oracle-xe
    environment:
      ORACLE_ALLOW_REMOTE: "true"
      ORACLE_PASSWORD: Password1
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 30s
    volumes:
      - oracledata:/opt/oracle/oradata

volumes:
  sqldata:
  mysqldata:
  postgresdata:
  oracledata:
